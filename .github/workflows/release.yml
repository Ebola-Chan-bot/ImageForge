name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish to, e.g. v2.3. Leave empty to use app versionName."
        required: false
        type: string
        default: ""

concurrency:
  group: android-release-manual-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release variables
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)"
          TAG_NAME="${{ github.event.inputs.tag_name || '' }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v$VERSION_NAME"
          fi

          RELEASE_ENABLED="true"
          RELEASE_SHA="$(git rev-parse HEAD)"
          ARTIFACT_RUN_ID=""

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RELEASE_SHA="${{ github.event.workflow_run.head_sha }}"
            ARTIFACT_RUN_ID="${{ github.event.workflow_run.id }}"
            echo "Release triggered from workflow_run SHA: $RELEASE_SHA"
            echo "Reuse build artifact from run id: $ARTIFACT_RUN_ID"
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "ARTIFACT_RUN_ID=$ARTIFACT_RUN_ID" >> "$GITHUB_ENV"
          echo "RELEASE_ENABLED=$RELEASE_ENABLED" >> "$GITHUB_ENV"

      - name: Download release APK artifact from triggering build
        if: env.RELEASE_ENABLED == 'true' && github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ github.token }}
          run_id: ${{ env.ARTIFACT_RUN_ID }}
          name: ImageForge-apks
          path: dist
          if_no_artifact_found: fail

      - name: Set up JDK 17 for manual dispatch fallback
        if: env.RELEASE_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK for manual dispatch fallback
        if: env.RELEASE_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
        uses: android-actions/setup-android@v4

      - name: Configure Android SDK path for manual dispatch fallback
        if: env.RELEASE_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Android SDK directory does not exist: $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > local.properties
          cat local.properties

      - name: Prepare release signing for manual dispatch fallback
        if: env.RELEASE_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured; release APK will use default signing behavior."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/android-signing"
          KEYSTORE_PATH="$RUNNER_TEMP/android-signing/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK for manual dispatch fallback
        if: env.RELEASE_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          RELEASE_APK="$(find app/build/outputs/apk/release -name '*release*.apk' -print -quit 2>/dev/null || true)"
          test -n "$RELEASE_APK"
          cp "$RELEASE_APK" dist/app-release.apk

      - name: Normalize release artifact path
        if: env.RELEASE_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -f dist/app-release.apk ]; then
            ls -lah dist/app-release.apk
            exit 0
          fi
          FOUND_APK="$(find dist \( -name 'app-release.apk' -o -name '*release*.apk' \) -type f | head -n 1)"
          test -n "$FOUND_APK"
          cp "$FOUND_APK" dist/app-release.apk
          ls -lah dist/app-release.apk

      - name: Publish APK to GitHub Release
        if: env.RELEASE_ENABLED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BODY_FILE="$RUNNER_TEMP/release-body.md"
          cat > "$BODY_FILE" <<'BODY'
          ### ImageForge v2.3 版本说明

          #### 生成与多图
          - 修复文生图“生成数量”只显示/保存第一张的问题：现在会解析接口返回的全部 `data[]` 图片。
          - 多图生成完成后会保存多张图片记录，并在预览区下方显示 1/2/3/4/5 等序号用于切换。
          - 优化多图保存、历史记录和完成提示，使实际返回几张就记录几张。
          - 长图预览已限制高度并支持在图片区域内上下滑动，描述词、保存、分享、关闭等按钮可继续下滑查看。

          #### 模型配置
          - 模型推荐项调整为：`gpt-image-1`、`gpt-image-1.5`、`gpt-image-2`，同时保留自定义输入。
          - 新增并保留“自动寻找生图模型”：支持从当前接口 `/models` 列表中筛选 id 或元数据中带有 image / imagine / gpt-image / dall-e 等特征的生图模型。
            - 当网关不支持 `/images/generations`，或 Grok Imagine 类网关返回 500/server_error 时，会自动回退到 `/chat/completions`，解析 Markdown 图片链接或 Base64 图片数据。
          - 对 `grok-imagine` / `imagine-image` / `image-lite` 等模型优先使用 Chat Completions 生图路径，避免不兼容网关硬怼 Images API。
          - 允许使用 HTTP Base URL，兼容内网、自建网关和临时代理地址。
          - 发现单个生图模型时自动写入文生图/图生图模型配置；发现多个时弹出二级列表供选择。
          - 模型下拉列表会合并自动发现结果与内置推荐模型。

          #### 发布流程
          - 自动发布已迁移到 Build Android APK 工作流：构建成功后同流程直接刷新 v2.3 Release。
          - 当前 Release Android APK 工作流仅作为手动兜底发布入口。

          #### 配置与体验
          - 去除 Base URL 默认值，首次配置与重置配置后不再自动填入官方接口地址。
          - 保留手动填写 Base URL、API Key、模型 ID、尺寸、画质、输出格式等能力。

          ### 下载
          请在本页面下方 Assets 中下载：
          - `app-release.apk`
          BODY

          sed -i "s/__TAG_NAME__/$TAG_NAME/g; s/__VERSION_NAME__/$VERSION_NAME/g" "$BODY_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME" --force || true
          git tag -f "$TAG_NAME" "$RELEASE_SHA"
          git push origin "refs/tags/$TAG_NAME" --force

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --target "$RELEASE_SHA" \
              --title "ImageForge $TAG_NAME" \
              --notes-file "$BODY_FILE" \
              --latest
          else
            gh release create "$TAG_NAME" \
              --target "$RELEASE_SHA" \
              --title "ImageForge $TAG_NAME" \
              --notes-file "$BODY_FILE" \
              --latest
          fi

          gh release delete-asset "$TAG_NAME" app-release.apk -y || true
          gh release delete-asset "$TAG_NAME" app-debug.apk -y || true
          gh release upload "$TAG_NAME" dist/app-release.apk --clobber
