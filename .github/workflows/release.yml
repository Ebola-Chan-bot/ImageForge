name: Release Android APK

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish to, e.g. v2.3. Leave empty to use app versionName."
        required: false
        type: string
        default: ""

concurrency:
  group: android-release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Resolve release variables
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)"
          TAG_NAME="${{ github.event.inputs.tag_name || '' }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v$VERSION_NAME"
          fi

          RELEASE_ENABLED="true"
          RELEASE_SHA="$(git rev-parse HEAD)"
          ARTIFACT_RUN_ID=""

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RELEASE_SHA="${{ github.event.workflow_run.head_sha }}"
            ARTIFACT_RUN_ID="${{ github.event.workflow_run.id }}"
            echo "Release triggered from workflow_run SHA: $RELEASE_SHA"
            echo "Reuse build artifact from run id: $ARTIFACT_RUN_ID"
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "ARTIFACT_RUN_ID=$ARTIFACT_RUN_ID" >> "$GITHUB_ENV"
          echo "RELEASE_ENABLED=$RELEASE_ENABLED" >> "$GITHUB_ENV"

      - name: Download release APK artifact from triggering build
        if: env.RELEASE_ENABLED == 'true' && github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ github.token }}
          run_id: ${{ env.ARTIFACT_RUN_ID }}
          name: ImageForge-apks
          path: dist
          if_no_artifact_found: fail

      - name: Set up JDK 17 for manual dispatch fallback
        if: env.RELEASE_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK for manual dispatch fallback
        if: env.RELEASE_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
        uses: android-actions/setup-android@v4

      - name: Configure Android SDK path for manual dispatch fallback
        if: env.RELEASE_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Android SDK directory does not exist: $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > local.properties
          cat local.properties

      - name: Prepare release signing for manual dispatch fallback
        if: env.RELEASE_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured; release APK will use default signing behavior."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/android-signing"
          KEYSTORE_PATH="$RUNNER_TEMP/android-signing/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK for manual dispatch fallback
        if: env.RELEASE_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          RELEASE_APK="$(find app/build/outputs/apk/release -name '*release*.apk' -print -quit 2>/dev/null || true)"
          test -n "$RELEASE_APK"
          cp "$RELEASE_APK" dist/app-release.apk

      - name: Normalize release artifact path
        if: env.RELEASE_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -f dist/app-release.apk ]; then
            ls -lah dist/app-release.apk
            exit 0
          fi
          FOUND_APK="$(find dist \( -name 'app-release.apk' -o -name '*release*.apk' \) -type f | head -n 1)"
          test -n "$FOUND_APK"
          cp "$FOUND_APK" dist/app-release.apk
          ls -lah dist/app-release.apk

      - name: Publish APK to GitHub Release
        if: env.RELEASE_ENABLED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BODY_FILE="$RUNNER_TEMP/release-body.md"
          cat > "$BODY_FILE" <<'BODY'
          ## ImageForge __TAG_NAME__

          ### 更新内容
          - 去除 Base URL 默认值，首次配置与重置配置后不再自动填入官方接口地址。
          - 新增“自动寻找生图模型”：从当前接口的 `/models` 列表中筛选生图相关模型。
          - 发现单个生图模型时自动写入“接口与模型”的文生图/图生图模型配置。
          - 发现多个生图模型时会弹出二级列表，由用户选择要使用的模型。
          - 模型下拉列表会合并自动发现结果与内置推荐模型，保留手动输入能力。

          ### 下载
          请在本页面下方 Assets 中下载：
          - `app-release.apk`
          BODY

          sed -i "s/__TAG_NAME__/$TAG_NAME/g; s/__VERSION_NAME__/$VERSION_NAME/g" "$BODY_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME" --force || true
          git tag -f "$TAG_NAME" "$RELEASE_SHA"
          git push origin "refs/tags/$TAG_NAME" --force

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --target "$RELEASE_SHA" \
              --title "ImageForge $TAG_NAME" \
              --notes-file "$BODY_FILE" \
              --latest
          else
            gh release create "$TAG_NAME" \
              --target "$RELEASE_SHA" \
              --title "ImageForge $TAG_NAME" \
              --notes-file "$BODY_FILE" \
              --latest
          fi

          gh release delete-asset "$TAG_NAME" app-release.apk -y || true
          gh release delete-asset "$TAG_NAME" app-debug.apk -y || true
          gh release upload "$TAG_NAME" dist/app-release.apk --clobber
