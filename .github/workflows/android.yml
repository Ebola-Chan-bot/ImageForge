name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_DIR" ]; then
            echo "Android SDK directory does not exist: $SDK_DIR"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > local.properties

          echo "Configured Android SDK:"
          cat local.properties

      - name: Verify build environment
        shell: bash
        run: |
          set -euxo pipefail
          java -version

          if [ ! -f ./gradlew ]; then
            echo "Missing Gradle Wrapper script: ./gradlew"
            exit 1
          fi

          if [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Missing Gradle Wrapper jar: ./gradle/wrapper/gradle-wrapper.jar"
            exit 1
          fi

          chmod +x ./gradlew
          echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          ./gradlew --version

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          test -f local.properties
          cat local.properties

      - name: Prepare release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured; release APK will use default signing behavior."
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/android-signing"
          KEYSTORE_PATH="$RUNNER_TEMP/android-signing/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run Android Lint
        shell: bash
        run: |
          mkdir -p ci-logs
          set +e
          "$GRADLE_CMD" :app:lintDebug --build-cache --configuration-cache --configuration-cache-problems=warn --stacktrace 2>&1 | tee ci-logs/lintDebug.log
          LINT_EXIT_CODE=${PIPESTATUS[0]}
          echo "LINT_EXIT_CODE=$LINT_EXIT_CODE" >> "$GITHUB_ENV"
          echo "Android Lint exit code: $LINT_EXIT_CODE"
          exit 0

      - name: Publish Lint Diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "Lint exit code: ${LINT_EXIT_CODE:-unset}"
          echo "Available reports and logs:"
          find app/build/reports ci-logs -maxdepth 5 -type f -print 2>/dev/null || true

          if [ -f ci-logs/lintDebug.log ]; then
            echo "----- ci-logs/lintDebug.log tail -----"
            tail -n 220 ci-logs/lintDebug.log || true
          fi

          if [ -f app/build/reports/lint-results-debug.txt ]; then
            echo "----- lint-results-debug.txt -----"
            cat app/build/reports/lint-results-debug.txt
          fi

          if [ -f app/build/reports/lint-results-debug.xml ]; then
            python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = "app/build/reports/lint-results-debug.xml"
          root = ET.parse(report).getroot()

          def esc(value: str) -> str:
              return str(value or "").replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")

          count = 0
          for issue in root.findall("issue"):
              issue_id = issue.attrib.get("id", "AndroidLint")
              severity = issue.attrib.get("severity", "Error")
              message = issue.attrib.get("message", "")
              explanation = issue.attrib.get("explanation", "")
              loc = issue.find("location")

              if loc is None:
                  print(f"::error title={esc(issue_id)}::{esc(message)}")
                  count += 1
                  continue

              file_path = loc.attrib.get("file", "")
              line = loc.attrib.get("line", "1")
              column = loc.attrib.get("column", "1")

              if file_path.startswith(os.getcwd() + os.sep):
                  file_path = os.path.relpath(file_path, os.getcwd())

              detail = message
              if explanation:
                  detail = f"{message}\n\n{explanation}"

              level = "error" if severity.lower() in {"fatal", "error"} else "warning"
              print(f"::{level} file={esc(file_path)},line={esc(line)},col={esc(column)},title={esc(issue_id)}::{esc(detail)}")
              count += 1

          print(f"Published {count} Android lint annotation(s).")
          PY
          elif [ -f ci-logs/lintDebug.log ]; then
            python3 - <<'PY'
          import pathlib

          log_path = pathlib.Path("ci-logs/lintDebug.log")
          text = log_path.read_text(errors="replace")
          lines = text.splitlines()

          def esc(value: str) -> str:
              return str(value or "").replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")

          interesting = []
          keys = [
              "FAILURE:",
              "Execution failed",
              "What went wrong:",
              "SDK location not found",
              "Could not",
              "Exception",
              "BUILD FAILED",
              "error:",
              "Error:"
          ]

          for i, line in enumerate(lines):
              if any(k in line for k in keys):
                  start = max(0, i - 4)
                  end = min(len(lines), i + 12)
                  block = "\n".join(lines[start:end])
                  if block not in interesting:
                      interesting.append(block)

          if not interesting:
              interesting.append("\n".join(lines[-120:]))

          for idx, block in enumerate(interesting[:8], start=1):
              print(f"::error file=ci-logs/lintDebug.log,line=1,title=Android Lint Console Failure {idx}::{esc(block)}")

          print(f"Published {min(len(interesting), 8)} console diagnostic annotation(s).")
          PY
          fi

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: |
            ci-logs/*.log
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-debug/
            app/build/reports/lint/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if Android Lint failed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${LINT_EXIT_CODE:-0}" != "0" ]; then
            echo "Android Lint failed with exit code ${LINT_EXIT_CODE}."
            exit "$LINT_EXIT_CODE"
          fi

      - name: Build Debug and Release APKs
        shell: bash
        run: |
          set -euo pipefail
          "$GRADLE_CMD" :app:assembleDebug :app:assembleRelease --build-cache --configuration-cache --configuration-cache-problems=warn --stacktrace --info

      - name: Validate APK Exists
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs -type f -iname '*.apk' -print

          if find app/build/outputs -type f -iname '*release*.apk' -print -quit | grep -q .; then
            echo "Release APK build succeeded."
          else
            echo "Release APK build failed or missing."
            exit 1
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ImageForge-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14


      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION_NAME="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)"
          TAG_NAME="v$VERSION_NAME"
          RELEASE_SHA="${GITHUB_SHA}"
          mkdir -p dist
          RELEASE_APK="$(find app/build/outputs/apk/release -name '*release*.apk' -print -quit 2>/dev/null || true)"
          test -n "$RELEASE_APK"
          cp "$RELEASE_APK" dist/app-release.apk
          ls -lah dist/app-release.apk

          BODY_FILE="$RUNNER_TEMP/release-body.md"
          cat > "$BODY_FILE" <<BODY
          ### ImageForge $TAG_NAME

          一个轻量的 Android 图像生成应用，支持文生图、参考图生成、自动寻找生图模型与历史管理。

          #### 功能概览
          - 文生图与参考图生成，单次稳定生成一张。
          - 自动寻找生图模型：从接口 \`/models\` 中筛选图像生成相关模型并自动填入。
          - 接口兼容：网关不支持 \`/images/generations\` 或返回 500/server_error 时自动回退到 \`/chat/completions\`，解析图片链接或 Base64 数据。
          - 支持 HTTP 明文 Base URL，兼容内网、自建网关与临时代理。
          - 后台任务、历史记录、错误详情排查，长图预览可上下滑动查看。

          #### 配置项
          - Base URL、API Key、接口模式、文生图 / 图生图模型 ID。
          - 图片尺寸、画质、输出格式、背景模式。

          ### 下载
          请在本页面下方 Assets 中下载：
          - \`app-release.apk\`
          BODY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME" --force || true
          git tag -f "$TAG_NAME" "$RELEASE_SHA"
          git push origin "refs/tags/$TAG_NAME" --force

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --target "$RELEASE_SHA" \
              --title "ImageForge $TAG_NAME" \
              --notes-file "$BODY_FILE" \
              --latest
          else
            gh release create "$TAG_NAME" \
              --target "$RELEASE_SHA" \
              --title "ImageForge $TAG_NAME" \
              --notes-file "$BODY_FILE" \
              --latest
          fi

          gh release delete-asset "$TAG_NAME" app-release.apk -y || true
          gh release delete-asset "$TAG_NAME" app-debug.apk -y || true
          gh release upload "$TAG_NAME" dist/app-release.apk --clobber
